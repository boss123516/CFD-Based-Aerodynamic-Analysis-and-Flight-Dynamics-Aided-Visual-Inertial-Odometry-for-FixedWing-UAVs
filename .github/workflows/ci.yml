name: pipeline
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_public_content.py --history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: ./setup.sh
      - run: .venv/bin/python -m pip install -r requirements-bag.lock.txt
      - run: .venv/bin/python -m unittest discover -s tests -p test_bag.py -v
